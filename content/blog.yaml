    Het Zomerdromen festijn wordt jaarlijks georganiseerd in Den Helder. Dit jaar was het voor de vijfde keer.
    Het is een combinatie van een romantische markt met allerlei kramen van veel zelfgemaakte materialen en lekkere taarten etc. Dit alles voor verschillende goede doelen.
    Tevens zijn er twee 'tenten' waar muziek gemaakt wordt door veelal plaatselijke koren en muzikanten.

    Dit jaar waren wij als trio ook van de partij.
    Het was even wat wennen aangezien de locatie 'de tent' een open muziekpodium was waar we tegen een hek aankeken wanneer we op onze stoeltjes zaten om een nummer te vertolken. Tevens was het buiten waardoor veel van ons stemgeluid verloren ging. Gelukkig waren er goede technici van het theater 'De Kampagne' aanwezig waardoor het aanwezige publiek ons toch heel goed kon horen.

