  content: |
    Het was dit pinksterweekend al voor de vijfde keer dat wij meededen met dit fantastische evenement! Elke 2 jaar wordt dit georganiseerd en wij maken elke keer weer een geheel nieuw programma voor deze optredens. Dit betekent dus nieuwe nummers zoeken, kijken of ze gearrangeerd kunnen worden, dat is namelijk niet altijd mogelijk omdat we maar met z'n drieën zijn.

    Dan begint het instuderen, een thema bedenken voor de nieuwe show, een verhaallijn, wie heeft welke rol en waarom. Wat willen we vertellen, welke nummers kunnen we daarvoor gebruiken. En wat trekken we aan. Kortom altijd vele vele vragen die beantwoordt dienen te worden.

    Ook dit keer is het weer gelukt. De show was geheel rondom het thema koken geschreven met wat kleine uitstapjes. Maar uiteindelijk was de eindconclusie toch dat het natuurlijk om de liefde gaat in het leven!

