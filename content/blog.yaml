    We hebben mogen optreden tijdens 'De Theatervloot' in de haven van Hoorn. Onze optredens waren op het schip 'De Egberdina', een stevenaak. De opzet van dit festival is vergelijkbaar met dat van 'Broadway in Den Hoorn' maar dan op 3 schepen en veel kleinschaliger. De schepen meren af in Medemblik en Hoorn waar de artiest dan 3 optredens op een avond verzorgt en het publiek gaat dan van schip naar schip.

    Ondanks de regen hebben we erg genoten van de sfeer op het schip en de intimiteit die dit met zich meebrengt. Een mooie ervaring. We zijn zelfs uitgenodigd om volgend jaar weer mee te doen en dan zullen we afmeren in de haven van Medemblik.

# legacy-review-source-id: 2010-06-06-opening-restaurant-de-luwte-den-burg-texel
- title: "Opening restaurant - Restaurant De Luwte - Den Burg - Texel"
  date: "6 juni 2010"
  link: ""
  images:
    - src: "content/images/20100606_opening_restaurant_restaurant_de_luwte_den_burg_texel.webp"
      alt: "Opening restaurant - Restaurant De Luwte - Den Burg - Texel"
      width: 2048
      height: 1536
    - src: "content/images/20100606_opening_restaurant_restaurant_de_luwte_den_burg_texel_02.webp"
