  link: ""
  images:
    - src: "content/images/20100423_cursus_evts_estill_voice_training_23_24_25_april_en_8_en_9_mei_texel.webp"
      alt: "Cursus EVTS (Estill Voice Training) 23, 24, 25 april en 8 en 9 mei - Texel"
      width: 2048
      height: 1536
    - src: "content/images/20100423_cursus_evts_estill_voice_training_23_24_25_april_en_8_en_9_mei_texel_02.webp"
      alt: "Cursus EVTS (Estill Voice Training) 23, 24, 25 april en 8 en 9 mei - Texel"
      width: 2048
      height: 1536
  content: |
    Op 23, 24 en 25 april zal er een cursus EVTS gegeven worden op Texel door Alberto ter Doest.

    Het Estill Voice Training System (EVTS) cursus is een unieke workshop. Jo Estill, doet reeds dertig jaar onderzoek naar de menselijke stem en ontwikkelde van daaruit deze methode. Zo wordt duidelijk dat het zeer goed mogelijk is gezond te zingen in pop, belt, jazz of klassiek. In de cursus wordt verduidelijkt wat we horen. Deze gegevens tonen welke spieren verantwoordelijk en nodig zijn voor de verschillende stemkwaliteiten.

    Vervolgens wordt in de cursus stap voor stap uitgelegd hoe we dit kunnen leren voelen en gebruiken. Hierdoor zijn we in staat om onze spieren, bijbehorende functies en geluid te leren beheersen en om dit in praktijk te brengen in allerlei soorten gezongen en gesproken repertoire.

    EVTS stelt iedereen in staat om zijn/haar vocale mogelijkheden naar wens volledig te ontwikkelen en is niet door smaak of voorkeuren gehinderd.

    Wij zijn de organisator en gaan dus ook meedoen waardoor we hopen dat onze zangkwaliteiten nog meer 'kleurschakeringen' kunnen krijgen!

    Met z'n allen weer even in de schoolbanken. Er waren vanuit heel Nederland cursisten naar Texel gekomen om deze bijzondere cursus mee te maken

