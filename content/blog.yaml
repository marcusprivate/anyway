# legacy-review-source-id: 2008-05-09-broadway-den-hoorn
- title: "Broadway - Den Hoorn - Texel"
  date: "9 mei 2008"
  link: ""
  images:
    - src: "content/images/20080509_broadway_den_hoorn_texel.webp"
      alt: "Broadway - Den Hoorn - Texel"
      width: 2048
      height: 1369
  content: |
    Ook dit jaar werden we gevraagd voor optredens op het Broadway Festival Den Hoorn.

    Acht optredens met een heel nieuw programma dat we samen met Lizzie Kean hebben gemaakt. Spannend natuurlijk, dat eerste optreden met een kersvers repertoire.

    Al op het Festival van 2006 werd ons optreden hoog gewaardeerd met fijne reacties en een “goede” pers. Dus nu, in 2008 moest het nog beter.

    Al bij ons eerste optreden was er een ruim applaus met veel complimenten, Vooral bij onze gevoelige liedjes “Love of my Life” en “True Colors” was de zaal muisstil met een en al aandacht. Ook onze humors “Kleine zwakke vrouw”en “I wish I was a punkrocker” waren precies in de roos.

    Een enthousiast publiek met lang aangehouden applaus en goedkeurend gefluit. We waren dik tevreden met 2008.

    Na de voorstellingen voor ons natuurlijk een heerlijk en goed gevoel.

