- title: Afsluiting verenigingsjaar Vrouwencontact - Castricum
  date: 29 mei 2026
  image: content/images/20260529_afsluiting_verenigingsjaar_vrouwencontact_castricum.webp
  link: ""
  content: |
    We hebben het verenigingsjaar mogen afsluiten voor de vrouwenvereniging van Castricum. We hebben 2 keer een voorstelling gespeeld en gezongen voor 80 vrouwen. Mooi om te zien dat er dan zoveel herkenning is in de zaal en dat er zeer genoten is! Zowel door ons als door het publiek! De zware onweersbui mocht de pret niet drukken en daar hebben we gewoon lekker doorheen gezongen!

- title: Besloten optreden opleiding mediumschap - Den Hoorn - Texel
  date: 28 mei 2026
  image: content/images/20260528_besloten_optreden_opleiding_mediumschap_den_hoorn_texel.webp
  link: ""
  content: |
    We mochten als verrassing optreden voor een groep cursisten die een 3-jarige opleiding mediumschap hadden afgerond. Heel bijzonder om voor zo'n klein, select gezelschap te mogen optreden. Het was een heel intieme setting waarin jong en oud zeer hebben genoten!

- title: Tweejaarlijks Huiskamerfestival Broadway Den Hoorn - Texel
  date: 23 mei 2026
  image: content/images/20260523_tweejaarlijks_huiskamerfestival_broadway_den_hoorn_texel.webp
  link: ""
  content: |
    Voor de 9e keer hebben we meegedaan aan dit huiskamerfestival. In het dorp Den Hoorn zijn 30 huiskamers ingericht als theater gedurende drie dagen. In elke huiskamer zijn er 4 optredens per avond door dezelfde artiest en het publiek gaat dan van huiskamer naar huiskamer om de optredens te zien.

    Elke 2 jaar maken we speciaal voor dit festival een nieuwe voorstelling met nieuwe liedjes! Het is dan altijd weer spannend om te zien of het nieuwe programma aanslaat. Spannend om te doen, maar ook altijd heel speciaal en mooi! Ook dit jaar was dit weer het geval. We hebben genoten en het publiek ook!

- title: Besloten optreden in restaurant Bij Jef - Texel
  date: 12 april 2026
  image: content/images/20260412_besloten_optreden_in_restaurant_bij_jef_texel.webp
  link: ""
  content: |
    Voor het eerst hebben wij opgetreden in dit prachtige Michelin sterrenrestaurant 'Bij Jef'. Dit was ter gelegenheid van een verjaardag van een van de gasten. We hebben het diner mogen omlijsten met verschillende nummers, tussen de gangen door. Het publiek vond het een prachtige belevenis en dat was het voor ons ook zeker. Voor herhaling vatbaar!

- title: Tuinenfestival - Castricum
  date: 14 september 2025
  image: content/images/20250914_tuinenfestival_castricum.webp
  link: ""
  content: |
    Al meerdere jaren treden we op tijdens het Tuinenfestival in Castricum. Tientallen tuinen zijn dan gratis toegankelijk voor publiek en in elke tuin zijn er artiesten die optreden. Het was nog even spannend of het doorging omdat het natuurlijk een buitenevenement is en er veel regen dreigde maar gelukkig is dat niet uitgekomen. Ook de wind deed tijdens het optreden flink zijn best! Maar wij stonden mooi beschut in een partytent en hebben 2 optredens mogen verzorgen! Het was weer een feest om te zingen voor zoveel mensen en nog mooier dat er mensen in het publiek waren die zo genoten hadden dat ze het 2e optreden nog een keertje zijn komen kijken! Volgend jaar doen we weer mee!

- title: Vocalink korenfestival - Drachten
  date: 2 november 2025
  image: content/images/20251102_vocalink_korenfestival_drachten.webp
  link: ""
  content: |
    We hadden nog nooit in Friesland opgetreden en aangezien Anneke hier opgegroeid is waren we blij dat we tijdens het Vocalink Korenfestival in Schouwburg De Lawei in Drachten mee konden doen.

    Er waren 2 theaterzalen waar de hele dag door allerlei koren van groot naar klein optraden. Ook was er een jury aanwezig die het optreden dan beoordeelde. Dat blijft altijd weer spannend maar ook stimulerend om te lezen wat er goed was en waar nog aan gewerkt kan worden! We kregen hele mooie complimenten en zeker ook omdat we natuurlijk altijd het kleinste 'koor' zijn en in onze optredens ook altijd nog een theaterelement toegevoegd is. Dit maakt het voor het publiek vaak heel verrassend.

- title: The Big Sing Haarlem - Hofjes concerten
  date: 5 juli 2025
  image: content/images/20250705_the_big_sing_haarlem_hofjes_concerten.webp
  link: ""
  content: |
    Wat is het toch prachtig om op zulke mooie plekken op te treden. We waren uitgenodigd in het hofje 'In den Groenen Tuyn' in Haarlem. Deze dag waren er door heel Haarlem allemaal optredens in diverse hofjes. De hele stad zindert dan van zoveel optredens! Toevallig stonden we 10 jaar ook al op deze plek op te treden! Ook nu was het weer een feest!! En onze jasjes vielen hier in hele goede aarde! Het oog wil ook wat! Toch?

- title: Dubbel optreden met Vokaal Kabaal uit Castricum
  date: 29 mei 2025
  image: content/images/20250529_dubbel_optreden_met_vokaal_kabaal_uit_castricum.webp
  link: ""
  content: |
    Wat een eer om uitgenodigd te worden door het fantastische koor Vokaal Kabaal uit Castricum! Zij vierden op Texel een prachtig jubileum! Wij traden samen op in de prachtige 600 jaar oude kerk in Den Hoorn! Mede door de prachtige geluidsinstallatie was de zang prachtig te horen! En wat was het een geweldige combinatie! Wij met zijn drieën, a capella, en daarna het grote koor van 60 mannen en vrouwen en een geweldige band! En hierin moeten we uiteraard de geweldige dirigent Rolien Eikelenboom ook niet vergeten! Chapeau!!

- title: Buitengewoon Texel
  date: 29 mei 2025
  image: content/images/20250529_buitengewoon_texel.webp
  link: ""
  content: |
    Dit jaar konden we meedoen aan het festival Buitengewoon Texel. Die dag waren er door heel Den Burg heel veel verschillende optredens van klassiek tot pop, en alles wat daartussen zit! Wij mochten in de mooie oude zaal staan van de Lindeboom!

- title: Atelier Bakkum - Marina Pronk
  date: 9 maart 2025
  image: content/images/20250309_atelier_bakkum_marina_pronk.webp
  link: ""
  content: |
    Wat geweldig om tussen alle prachtige kunstwerken te mogen optreden. We waren uitgenodigd door de kunstenaar Marina Pronk. Elke 2 weken wordt er in het atelier een artiest uitgenodigd! Dit keer mochten wij en wat was het genieten! Ook al ziet de foto er anders uit! Maar dat doet zingen met je en dan sta je niet altijd even charmant op de foto! Hahaha

- title: De Oude Keuken - Castricum
  date: 19 januari 2025
  image: content/images/20250119_de_oude_keuken_castricum.webp
  link: ""
  content: |
    We waren uitgenodigd om nogmaals in de Oude Keuken op te treden! Een prachtige locatie waar vroeger de gaarkeukens waren van alle ziekenhuizen in de omgeving. Wat blijft het toch altijd prachtig om het publiek te kunnen meenemen in het verhaal wat wij vertellen door middel van de muziek en dat we op deze manier mensen blij kunnen maken en kunnen ontroeren!

- title: Balk TOP Festival 2024 - De Doelen - Rotterdam
  date: 9 november 2024
  image: content/images/20241109_balk_top_festival_2024_de_doelen_rotterdam.webp
  link: ""
  content: |
    Elke 2 jaar is het Balk TOP Festival in de Doelen in Rotterdam. Altijd een heel groot festival waar allemaal a capella groepen vanuit heel Nederland optreden. Om uitgenodigd te worden om mee te doen bepaalt een jury n.a.v. een filmpje of je geselecteerd wordt. En we mochten dit jaar ook weer meedoen! Het blijft altijd een super locatie en in elke ruimte bruist het van de muziek! Het was weer een feest!

- title: 25-jarig jubileum - De Toegift - Texel
  date: 13 oktober 2024
  link: ""
  images:
    - src: "content/images/20241013_25_jarig_jubileum_de_toegift_texel.webp"
      alt: "25-jarig jubileum - De Toegift - Texel"
      width: 924
      height: 2000
    - src: "content/images/20251013 met Elisaband IMG-20241013-WA0008.webp"
      alt: "Anyway met de Elisaband tijdens het 25-jarig jubileum"
      width: 1600
      height: 1200
  content: |
    Je gelooft het niet maar we zingen al 25 jaar met elkaar! Hoognodig om dit een keer met elkaar te vieren. Dit hebben we gedaan door een middagoptreden in Theater De Toegift in Den Hoorn.

    Tevens heeft ook een nieuwe band op Texel, de Elisaband, opgetreden en hebben we ook een aantal nummers samen gezongen. Het was een feestje om dit samen met de volle zaal zo te mogen vieren! Op naar de volgende 25 jaar!

- title: Optreden tijdens lezing Maarten Oversier - Texel
  date: 27 september 2024
  image: content/images/20240927_optreden_tijdens_lezing_maarten_oversier_texel.webp
  link: ""
  content: |
    We waren gevraagd om op te treden tijdens een lezing van Maarten Oversier. De zaal was helemaal vol en wij mochten de lezing muzikaal omlijsten. Het was prachtig om te doen, ook omdat weer duidelijk werd dat muziek een fantastische aanvulling kan zijn op dat wat verteld wordt! Het was een situatie van 1+1 = 3. Een hartverwarmende en geweldige avond!

- title: Muziektuinen festival - Castricum
  date: 8 september 2024
  image: content/images/20240908_muziektuinen_festival_castricum.webp
  link: ""
  content: |
    Vandaag weer onze show vier keer in de buitenlucht mogen spelen! Altijd spannend want je weet nooit hoeveel mensen je kunt verwachten! Maar wat hebben we genoten en het publiek ook. Soms even overstemd door voetbalfans of een vliegtuig maar dat mocht de pret niet drukken.

- title: Huiskamerfestival Broadway 2024 - Texel
  date: 17, 18 mei 2024
  image: content/images/20240517_huiskamerfestival_broadway_2024_texel.webp
  link: ""
  content: |
    Wow! Na zoveel oefenen, nieuwe nummers, nieuw thema, nieuwe teksten, nieuwe attributen etc. etc. is het gelukt om een mooie nieuwe show neer te zetten! Dit is altijd een lang en soms moeizaam proces waar we bijna 2 jaar aan hebben gewerkt om voor elkaar te krijgen. Dit is gelukt met de hulp van diverse arrangeurs die de nummers voor ons schrijven en ook onze regisseur en zangjuf die ons helpt om het programma te maken en om ook daarna de puntjes op de I te zetten waardoor het een goedlopende en logische show wordt.

    We hebben deze show nu 8 keer mogen spelen tijdens dit festival! Wij hebben dan 4 optredens per avond verzorgd, met elke keer weer nieuw publiek! Het was een groot feest!!

- title: Huiskamerconcert - Heemstede
  date: 23 september 2023
  image: content/images/20230923_huiskamerconcert_heemstede.webp
  link: ""
  content: |
    Elk jaar geeft de familie Collins de gelegenheid voor eenieder die dat wil om op te treden in hun huiskamer. Iedereen neemt dan ook wat te eten mee, wat gedurende de avond dan gezellig met elkaar opgegeten wordt, dit afgewisseld met meerdere optredens. Wij waren hiervoor uitgenodigd en hebben 2 kleine optredens verzorgd. We zijn super gastvrij ontvangen en de reacties waren laaiend enthousiast!

- title: Gastoptreden bij Katholieke Vrouwen Gilde - Castricum
  date: 14 september 2023
  image: content/images/20230914_gastoptreden_bij_katholieke_vrouwen_gilde_castricum.webp
  link: ""
  content: |
    We hebben een optreden mogen verzorgen bij de opening van het verenigingsjaar van het Katholieke Vrouwen Gilde in Noord Scharwoude. Het blijft altijd spannend als je ergens komt en niet precies weet wat het publiek verwacht. Een deel van de vrouwen heeft super genoten en een ander deel heeft heerlijk bijgekletst met elkaar! Maar evengoed super genoten dat het optreden, nadat het 2 keer niet gelukt was, nu toch is doorgegaan!

- title: Korendagen - Monnickendam
  date: 10 juni 2023
  image: content/images/20230610_korendagen_monnickendam.webp
  link: ""
  content: |
    Wat hebben we genoten van deze prachtige dag in Monnickendam! We traden op in een heel mooi klein kerkje wat tot de nok met publiek gevuld was. Ook hebben we andere mooie en verrassende optredens gezien. Het weer hielp ook mee aan het slagen van dit festival!

- title: Gastoptreden bij het koor Swing uit Heiloo
  date: 3 juni 2023
  image: content/images/20230603_gastoptreden_bij_het_koor_swing_uit_heiloo.webp
  link: ""
  content: |
    We mochten bij het jaarlijkse optreden van het koor Swing een deel van het programma verzorgen. Het optreden was in een hele grote ronde kerk, wat wel wat lastig was voor de akoestiek, waardoor we deze keer gekozen hadden om te zingen met microfoons. Voor ons ook even wennen omdat we dat niet vaak doen. Uiteindelijk was het een hele mooie afwisselende avond!

- title: Privé optreden - Texel
  date: 15 april 2023
  image: content/images/20230415_priv_optreden_texel.webp
  link: ""
  content: |
    Ook worden wij wel eens uitgenodigd om op een privé feestje te komen zingen. Zeker in een klein gezelschap kan het zingen soms ontroeren en mensen tot tranen toe beroeren. Altijd heel mooi om te zien dat muziek zo kan raken!

- title: Candle light shopping festival - Castricum
  date: 17 december 2022
  image: content/images/20221217_candle_light_shopping_festival_castricum.webp
  link: ""
  content: |
    Optreden tijdens het Candle light shopping festival in Castricum is altijd een feest. De winkels zijn open, overal staan kraampjes en op iedere hoek wordt muziek gemaakt. Ook wij waren weer uitgenodigd om daar te zingen.

    Al lopend door de rijk versierde straten met kerstversiering hebben wij heerlijk gezongen die avond!

- title: Muziektuinen festival - Castricum
  date: 11 september 2022
  image: content/images/20220911_muziektuinen_festival_castricum.webp
  link: ""
  content: |
    Heerlijk in de tuin mogen optreden van Wim en Anita. Een heerlijk prachtige en beschutte tuin. Het is altijd wel weer spannend komen er wel mensen luisteren. Maar de animo was overweldigend. Er moesten steeds meer stoelen bij! Het weer werkte ook goed mee! Kortom was weer een middag met 3 optredens in een tuin! Zeker voor herhaling vatbaar!

- title: Hofjesconcerten - Haarlem
  date: 25 juni 2022
  image:
  link: ""
  content: |
    We mochten 2 keer optreden in een prachtig oud hofje in Haarlem. Heerlijk om weer buiten te kunnen zingen en helemaal bijzonder was dat er meerdere mensen in de tuinen zaten die ons jaren geleden ook al gezien hadden bij andere festivals en nu speciaal nog een keer naar ons kwamen luisteren. Helaas vergeten door alle drukte en het rennen van het ene naar het andere optreden om een foto te maken!

- title: Huiskamerfestival Broadway 2022 - Texel
  date: 3, 4, 5 juni 2022
  image: content/images/20220603_huiskamerfestival_broadway_2022_texel.webp
  link: ""
  content: |
    Wat was het een feest!! Na 4 jaar werd het huiskamerfestival Broadway Den Hoorn weer georganiseerd. Dit vindt in principe elke 2 jaar plaats in het pinksterweekend. Door Corona is het helaas 2 keer uitgesteld. Maar nu was het weer mogelijk en wat was het een feest!

    We hebben 2 avonden mogen optreden met 4 optredens op een avond. De show waar we bijna 2 jaar aan gewerkt hadden kon nu eindelijk gespeeld worden! Wij hebben er enorm van genoten en aan de reacties van het publiek te horen waren zij ook heel enthousiast!

- title: Muziek tuinen festival - Castricum
  date: 5 september 2021
  image: content/images/20210905_muziek_tuinen_festival_castricum.webp
  link: ""
  content: |
    We hebben 4 optredens verzorgd tijdens een nieuw Muziek tuinen festival in Castricum. Diverse tuinen waren als theater ingericht en elk uur kwam er nieuw publiek kijken. Het was prachtig weer en heel leuk om te doen!

    We werden super verwend bij onze gastvrouwen en dit festival is zeker voor herhaling vatbaar! Voor ons een mooie gelegenheid om de nieuwe show die we aan het maken zijn 4 keer te kunnen spelen om zo te kijken wat wel en niet aanslaat bij het publiek.

- title: Buitenfestival Skemere - Texel
  date: 16 juli 2021
  image: content/images/20210716_buitenfestival_skemere_texel.webp
  link: ""
  content: |
    Het festival Skemere was dit jaar weer mogelijk. Op het voetbalveld van Den Hoorn traden diverse zangers, dichters, theatermakers en dergelijke op. Ook wij mochten dit jaar weer meedoen. Elk kwartier hadden we een optreden waar we steeds 3 à 4 liedjes ten gehore brachten. Voor ons een mooie oefening om nieuwe nummers waar we een jaar aan gewerkt hadden voor het eerst na de eerste lockdown ten gehore te brengen.

- title: "Digitaal evenement Klifhanger #Kunsdt Festival - Texel"
  date: 19 september 2020
  image: content/images/20200919_digitaal_evenement_klifhanger_kunsdt_festival_texel.webp
  link: ""
  content: |
    Vanwege de Corona pandemie is live optreden helaas niet mogelijk. Vandaar dat er een digitaal evenement georganiseerd is in het Texelse bos genaamd digitaal evenement Klifhanger #Kunsdt Festival. Het publiek kan een kaartje downloaden en op verschillende plekken in het bos zijn plaatsen waar je een digitaal optreden kan zien van een artiest.

    Ook wij hebben hier aan meegedaan. Het was fijn om toch weer te kunnen zingen met elkaar.

- title: Buitenoptreden bij Bejaardenhuis De Gollards - Texel
  date: 26 juni 2020
  image: content/images/20200626_buitenoptreden_bij_bejaardenhuis_de_gollards_texel.webp
  link: ""
  content: |
    Door het coronavirus was binnen optreden niet mogelijk en hebben we gedurende 2 uur buiten opgetreden voor het bejaardenhuis. Na elke keer 3 liedjes gezongen te hebben liepen we naar een volgend punt buiten langs het gebouw. De mensen genoten van de zang door op het balkon te staan of voor de ramen. Voor ons was het een heftig optreden, mede door de brandende zon en de hitte van 28 graden. Maar we vonden het heel fijn dat we in deze moeilijke tijd toch wat afleiding hebben kunnen geven.

- title: Huiskamerconcert Han Heevel - Castricum
  date: 8 maart 2020
  image: content/images/20200308_huiskamerconcert_han_heevel_castricum.webp
  link: ""
  content: |
    We waren uitgenodigd om in de huiskamer van Han Heevel op te treden. Han Heevel nodigt elke maand artiesten uit om op te treden. We hebben 2 optredens van 3 kwartier verzorgd. Voor onszelf een hele uitdaging, maar de reacties waren laaiend enthousiast. Tja....we nemen altijd van alles mee!

- title: Huiskamerfestival Gluren bij de Buren - Haarlem
  date: 9 februari 2020
  image: content/images/20200209_huiskamerfestival_gluren_bij_de_buren_haarlem.webp
  link: ""
  content: |
    We deden dit keer voor het eerst mee tijdens het festival 'Gluren bij de Buren'. Dit wordt door heel Nederland georganiseerd en mensen stellen hun huiskamer beschikbaar waar je dan 3x kunt optreden met steeds een ander publiek. Elke voorstelling duurt dan 30 minuten. Het is een gratis evenement en je weet nooit hoeveel mensen er dan in de huiskamer zullen zitten.

    We werden super hartelijk ontvangen en uitermate goed verzorgd door de gastvrouw (eigenaar) van het huis. Het spannende van dit optreden was voor ons dat op deze dag de storm Ciara aan het razen was. Dit maakte dat wij niet wisten of wij weer terug naar huis konden aangezien de boot niet voer. We konden 's ochtends nog net met een boot mee. Gelukkig liep het verder prima af. We hebben 2 uurtjes 's avonds gewacht en toen konden we toch weer het eiland op.

    In het wachtlokaal hebben we liedjes gezongen voor iedereen die ook aan het wachten was. Super leuk! Het optreden in de huiskamer was knus en heel gezellig! Wij hebben genoten!

- title: Cultuurnacht Oosterend - Texel
  date: 8 februari 2020
  image: content/images/20200208_cultuurnacht_oosterend_texel.webp
  content: |
    Tijdens deze cultuurnacht treden er diverse artiesten op die een voorproefje geven van datgene wat komend jaar op cultureel gebied op Texel te beleven is. Wij hebben 3 keer een klein deel laten zien van het programma wat we gaan spelen tijdens huiskamerfestival 'Broadway Den Hoorn'. We speelden in de kapsalon en hebben ons uitermate goed vermaakt. De sfeer in het gehele dorp was super relaxed en gezellig. Mede door de goede organisatie van het evenement!

- title: Candlelight shopping - Castricum
  date: 21 december 2019
  image: content/images/20191221_candlelight_shopping_castricum.webp
  content: |
    We mochten zingen tijdens het jaarlijkse evenement 'Candle Light Shopping' in Castricum. In de winkelstraten stonden overal kraampjes en op het plein was een levende kerststal. Ook waren er diverse andere optredens van andere koren en muzikanten.

    Wij zijn gedurende deze avond ook de straten al zingend doorgegaan en hebben zowel op straat als in winkels onze muziek laten horen. Het was een feest en de kerstsfeer was in het hele dorp goed te voelen. Een geweldige ervaring om mee te maken! Wij hebben super genoten! De foto is van Heleen Vink.

- title: Gezamenlijk optreden met StarSingers in de Koogerkerk - Castricum
  date: 8 december 2019
  image: content/images/20191208_gezamenlijk_optreden_met_starsingers_in_de_koogerkerk_castricum.webp
  content: |
    Door ziekte van het Connection koor van onze dirigente Rolien Eikelenboom hebben we in deze prachtige kerk opgetreden. Het was een gezamenlijk concert met het StarSingers koor. Super leuk en zeer afwisselend voor het publiek omdat we allebei een totaal ander repertoire laten horen. Het was een mooie combinatie!

- title: Optreden woonzorgcentrum - Castricum
  date: 3 november 2019
  image: content/images/20191103_optreden_woonzorgcentrum_castricum.webp
  content: |
   Altijd bijzonder om voor deze bijzondere groep van mensen op te treden. De reacties waren van gewoon luisteren tot meezingen en bewegen! Zo mooi om te zien dat mensen muziek weer dingen van vroeger laat herinneren wat ontroerende momenten opleverde. Prachtig!

- title: Korenfestival Musical Popkoor Broadway - Hoorn
  date: 6 oktober 2019
  image: content/images/20191006_korenfestival_musical_popkoor_broadway_hoorn.webp
  content: |
    Voor het eerst dat we in dit festival optraden in het prachtige theater van Hoorn. Er waren 47 koren die deze dag een optreden verzorgden. Wij traden op in 't Hof met een show van 25 minuten, met daarna een masterclass van regisseur Bas Groenenberg. Hij was onder de indruk en had dit nog nooit gezien, 3 vrouwen die acapella zingen en tegelijkertijd een show neerzetten. Wat geweldig om van een professional aanwijzingen en tips te krijgen! Maar uiteraard waren er nog verbeterpunten en deze nemen wij mee voor onze volgende show!

- title: Zingen tijdens een Huwelijksceremonie - Texel
  date: 26 juni 2019
  image: content/images/20190626_zingen_tijdens_een_huwelijksceremonie_texel.webp
  content: |
   Voor ons de eerste keer om tijdens de huwelijksvoltrekking te zingen. We hadden samen met het bruidspaar de verschillende nummers uitgezocht om tijdens de diverse onderdelen van de ceremonie te zingen.

   Een heel bijzondere ervaring om in deze prachtige kerk en bij deze gelegenheid te mogen zingen.

- title: Verjaardagsfeest Israël
  date: 1 juni 2019
  image: content/images/20190601_verjaardagsfeest_isral.webp
  content: |
    Hoe bijzonder was het om op te treden voor de familie van Ruthie! Haar broer werd 60 jaar en had ons uitgenodigd om te komen zingen op zijn verjaardag. Haar familie had haar nog nooit horen zingen op deze manier van a capella met z'n drieën. Na afloop vloeiden de tranen uitvoerig... dus wat ons betreft een geslaagd optreden! Uiteraard hebben we dit optreden uitgebreid met een paar extra vakantiedagen samen in Israël!

- title: Balkfestival - Noordwijk
  date: 18 mei 2019
  image: content/images/20190518_balkfestival_noordwijk.webp
  content: |
    Elk jaar is er een Balkfestival in onze regio. Ook dit jaar hebben we weer meegedaan en onze nieuwe show voor het eerst op de planken gebracht. Dit kon in dit festival 2 keer voor verschillende jury's. De juryrapporten waren lovend maar hadden uiteraard ook kritiekpunten. Deze gaan we zeker meenemen naar een volgend optreden.

- title: Paradiso Korenfestival - Amsterdam
  date: 20 januari 2019
  image: content/images/20190120_paradiso_korenfestival_amsterdam.webp
  content: |
   Altijd weer super leuk om mee te doen en een prima plek om nieuwe nummers uit te proberen! Er treden dan in Paradiso tientallen koren op daardoor is het altijd wel heel druk maar het blijft een speciale plek om op te treden! Het publiek is altijd enthousiast en super gezellig!

- title: Open podium Koogerkerk - Castricum
  date: 18 november 2018
  image: content/images/20181118_open_podium_koogerkerk_castricum.webp
  content: |
   Voor de 2e keer mogen optreden in de Kooger Kerk. Nu als afsluitende act na een middag van het Open Podium. Wat een feest om iedereen te zien optreden en zelf het festival te mogen afsluiten. Het was een eer om te doen! Super genoten!

- title: Koogerkerk - Zuid Scharwoude
  date: 9 september 2018
  image: content/images/20180909_koogerkerk_zuid_scharwoude.webp
  content: |
   We hebben een optreden gegeven in de prachtige kerk van Zuid Scharwoude. We hadden een programma gemaakt van 2 x 3 kwartier. In het eerste deel speelden we onze show, met de cursus 'Hoe gaan we om met de drama's in ons leven', en na de pauze brachten we meer losse nummers met kleine anekdotes.

   Het publiek was uitermate verrast en had dit soort muziek nog niet vaak op deze plek gehoord. Voor ons zeker voor herhaling vatbaar, vandaar dat we in 2019 weer optreden en ook uitgenodigd zijn om op 18 november 2018 mee te doen als afsluiter tijdens het Open Podium.

- title: Radio Texel
  date: 26 juli 2018
  image: content/images/20180726_radio_texel.webp
  content: |
   Op de heetste dag van het jaar, ruim 35 graden, hebben we op het strand opgetreden voor Radio Texel. We hebben de uitzending opgeluisterd door meerdere liedjes ten gehore te brengen.

   Veel publiek was er niet, want die lagen allemaal op het strand, maar dat maakte het plezier niet minder. Vast hebben vele luisteraars van ons genoten. Daarna hebben wij onszelf verwend met een heerlijke duik in de zee!

- title: Skemere - Texel
  date: 15 juni 2018
  image: content/images/20180615_skemere_texel.webp
  content: |
   Er is een nieuw initiatief geboren op Texel: 'Skemere'. In juni is er een festival georganiseerd dat zich afspeelde op een voetbalveld in de avond, wanneer het begint te schemeren. Diverse artiesten waren uitgenodigd. Het publiek kreeg een 10-rittenkaart waarmee ze de 10 kleine voorstellingen in de buitenlucht konden afgaan. Na 10 minuten was elke voorstelling afgelopen en kon je doorschuiven naar de volgende. De optredens waren zeer divers, van dichters tot aan zangers.

   Ook wij deden mee en wat was de sfeer bijzonder! We begonnen met de eerste voorstelling met nog een klein beetje licht en eindigden in het donker. Wel waren de optreedplekken verlicht door een paar kleine lampjes. Dit gaf een heel intieme sfeer. Een festival dat nog zeker moet groeien, maar wat ons betreft absoluut voor herhaling vatbaar is.

- title: Texel Culinair
  date: 14 september 2018
  image: content/images/20180914_texel_culinair.webp
  content: |
   Voor de 4e keer alweer hebben we op dit festival gezongen. Door de hele dorpsstraat in De Koog presenteren alle restaurants hun lekkernijen. Wij lopen dan door de straten en zingen voor degenen die graag een lied willen horen.

   Dat was dit jaar wat lastiger, omdat er in de straat meerdere dj's aan het draaien waren en het voor ons dan lastig is om daar overheen te zingen. Toch is het ons weer gelukt om mensen te vermaken en te ontroeren. Dit festival is een mooie gelegenheid om het publiek te laten ervaren wat muziek kan doen. Dat bleek wel doordat we meerdere mensen blij, verrast of geëmotioneerd achter hebben gelaten nadat we een nummer voor ze gezongen hadden.

- title: Dubbel optreden met Brothers 4 Tune in de Toegift - Texel
  date: 18 februari 2018
  image: content/images/20180218_dubbel_optreden_met_brothers_4_tune_in_de_toegift_texel.webp
  content: |
   Het optreden dat we met de Brothers in Castricum hebben gedaan, hebben we nu op Texel herhaald. Voor beide groepen was het heel leuk om hetzelfde programma, maar nu op een andere plek en voor ander publiek, te kunnen herhalen. Het publiek genoot zowel van ons als van de vijfkoppige a capella-mannengroep, die voor velen nieuw was. Door deze afwisseling van 2 verschillende groepen was dit voor het publiek een mooie middag!

- title: Cultuurnacht Oudeschild
  date: 17 februari 2018
  image: content/images/20180217_cultuurnacht_oudeschild.webp
  content: |
   In de cultuurnacht van Oudeschild waren er gedurende de avond en nacht overal op diverse plekken optredens. Van het museum tot aan diverse winkels. Zo stonden wij bij de visvoer en hebben daar 2 optredens mogen geven.

   Het was een bruisende avond en nacht daar in Oudeschild. Er waren duizenden mensen op de been. Zeker voor herhaling vatbaar.

- title: Benefiet diner Tesselhuus - Texel
  date: 3 februari 2018
  image: content/images/20180203_benefiet_diner_tesselhuus_texel.webp
  content: |
   Er werd een benefietdiner verzorgd voor het Tesselhuus (vakantiehuis voor kinderen en volwassenen met een meervoudige handicap). Meerdere Texelse artiesten werden uitgenodigd als 'Parels' van Texel om een optreden te verzorgen.

   Ook wij mochten meedoen. Voor deze gelegenheid hadden we ons extra uitgedost om het verrassingseffect te verhogen. En dat heeft gewerkt! Super leuk om te doen!

- title: De Oude Keuken - Castricum
  date: 13 mei 2017
  image: content/images/20170513_de_oude_keuken_castricum.webp
  content: |
    We hebben een muzikale middag verzorgd in De Oude Keuken in Castricum. Een restaurant/café waar regelmatig artiesten komen om de middag muzikaal te omlijsten. Voor ons de eerste keer om eigenlijk een soort achtergrond te zijn terwijl iedereen gezellig eet en drinkt met elkaar.

    Het was eerst even zoeken naar de juiste plek zodat iedereen ons goed kon zien en horen. Het is ons gelukt om het publiek op meerdere momenten stil te krijgen! Achteraf kregen we veel mooie complimenten en willen ze graag dat we nog een keer terugkomen.

- title: Balkfestival - Noordwijk
  date: 13 mei 2017
  image: content/images/20170513_balkfestival_noordwijk.webp
  content: |
    Het was voor ons alweer even geleden dat wij mee hebben gedaan aan een Balkfestival met een jury. Voor ons altijd weer een uitdaging. Deze keer des te meer aangezien we net een nieuwe show hadden gemaakt met een nieuwe verhaallijn en veel nieuwe liedjes. De middag voor het optreden hebben we nog geschaafd met onze coach Rolien Eikelenboom aan de teksten en de nummers. Kortom, er was veel nieuws om aan te denken tijdens het spelen en zingen. De jury was eerst wat huiverig of het wel mogelijk was om met zijn drieën een volle klank neer te kunnen zetten, maar werd hier meerdere keren door verrast. Uiteraard waren er wel kritiekpunten en daar gaan we zeker mee aan het werk.

- title: Texel Culinair
  date: 9 september 2017
  image: content/images/20170909_texel_culinair.webp
  content: |
    Voor ons alweer de 3e keer dat we tijdens dit culinaire straatfeest mogen optreden. We hebben onze 'Culinair pakjes' weer aangedaan en zijn de straat ingelopen. Voor eenieder die dat wil zingen we dan een liedje. Dit kan uiteindelijk heel intiem worden als je maar voor 2 mensen zingt (kan ook heel intimiderend of overweldigend zijn voor de luisteraar), maar soms gebeurde het ook dat er ineens 50 mensen om je heen staan die meeluisteren. Altijd voor ons weer een heel intensief festival omdat het buiten zingen zonder versterking best zwaar is en je op moet letten dat je jezelf niet gaat overschreeuwen doordat je veel mensen wilt bereiken met de muziek. Dit voel je dan heel duidelijk de volgende dag... en aangezien wij 2 middag/avonden achter elkaar zingen, is het opletten geblazen!

- title: Dubbelconcert met Brothers 4 Tune - Castricum
  date: 16 september 2017
  image: content/images/20170916_dubbelconcert_met_brothers_4_tune_castricum.webp
  content: |
    We waren uitgenodigd door de mannen a capella groep Brothers-4-Tune om een gezamenlijk optreden te verzorgen in het theater van Castricum. Voor ons weer een mooie gelegenheid om onze nieuwe show met als thema de cursus 'Hoe gaan we om met de drama's in ons leven' te kunnen spelen. Ook voor het eerst dat we met geluidsversterking (headsets) hebben gezongen. Wel even anders omdat je elkaar via de boxen terug hoort en dit vooral in het begin even zoeken was hoe we goed naar elkaar konden 'kleuren'. Maar super leuk om te doen en we hebben zelfs even overwogen om een eigen geluidsinstallatie te kopen. Het was een mooie afwisselende avond. Dit omdat de Brothers een totaal andere manier van zingen en theater maken hebben als wij. Maar dit maakt het voor het publiek juist extra aantrekkelijk.


- title: Struun festival - Texel
  date: 19 november 2017
  image: content/images/20171119_struun_festival_texel.webp
  content: |
    Struun op Texel is een gratis festival in de maand november. Voor een buitenoptreden dus best wel koud en zeker toen het begon te regenen, hebben we iedereen gevraagd om bij ons in het 'Glazen Paleis' te komen staan (zie foto). Dit maakte het extra knus en speciaal, zowel voor ons als voor het publiek.

    Tijdens dit festival mochten we 2 keer optreden en 1 keer binnen (zie foto). Een totaal andere sfeer daardoor, maar dat maakte het juist heel leuk om te doen. Ook hier hebben we weer opgetreden met ondersteuning van microfoons. Deze dag maakte maar weer extra duidelijk dat de geluidsman een hele grote invloed kan hebben op de kwaliteit van je optreden. Dat blijft dus een aandachtspunt voor de toekomst!

- title: Glazen Paleis, kerstmarkt - Texel
  date: 28 december 2017
  image: content/images/20171228_glazen_paleis_kerstmarkt_texel.webp
  content: |
    Tijdens een kerstmarkt in Den Burg hebben we opgetreden om de kerstsfeer te verhogen. Een prachtige plek om te staan met in deze donkere maand prachtige verlichting. Het was voor de mensen met hun kraampjes een koude dag, maar wij hebben er zeer van genoten om op deze mooie plek weer te mogen zingen. Heel sfeervol!

- title: Ecomare, De Koog
  date: 29 december 2016
  image: content/images/20161229_ecomare_de_koog.webp
  content: |
    Ecomare organiseerde een avondwandeling in de kerstvakantie en vroeg ons om deze muzikaal te omlijsten wanneer de wandelaars weer binnenkwamen en werden verwarmd met chocolademelk of glühwein. Wij hebben ons best gedaan om ook de oren te verwarmen met onze muziek. Weer een hele nieuwe ervaring voor ons en bijzonder om mee te maken.

- title: Kerstmiddag in Den Hoorn
  date: 16 december 2016
  image: content/images/20161216_kerstmiddag_in_den_hoorn.webp
  content: |
    Wat was het weer leuk om weer een keer onze kerstnummers ten gehore te kunnen brengen.

    Er was een zaal vol met mensen uit Den Hoorn en wij waren onderdeel van de kerstmiddag. Er werden gedichten en verhalen voorgelezen en wij hebben hier een bijdrage kunnen leveren, waardoor aan het einde van de middag de kerstsfeer er goed in zat! Daarna kon iedereen verder aan tafel gaan voor een mooi kerstdiner.

- title: Optreden met de acapella groep Basix en jazz koor Vocal Attraction
  date: 7 oktober 2016
  image: content/images/20161007_optreden_met_de_acapella_groep_basix_en_jazz_koor_vocal_attraction.webp
  content: |
    Een optreden met een professionele acapella mannengroep uit Denemarken: Basix. Zowel wij als de andere groep Vocal Attraction mochten een deel van de avond invullen. Aan het einde zongen we nog 1 nummer met elkaar. Wat een feest om deze mannen te horen! En heerlijk om hier een onderdeel van te zijn geweest.

- title: Texel Culinair
  date: 9 september 2016
  image: content/images/20160909_texel_culinair.webp
  content: |
    Het blijft altijd weer een groot feest om 2 dagen achter elkaar te mogen optreden tijdens Texel Culinair, ook al is 4 uur zingen in de buitenlucht best heel inspannend, maar blijft het geweldig om te doen. Een heel weekend is het dorp De Koog op Texel omgetoverd tot een geweldig culinair festijn waar de meeste restaurants hun gerechten trots presenteren. Een evenement wat door duizenden bezoekers bezocht wordt!

    Wij gaan dan zingend door de straat en vermaken eenieder die dat wil met een lied. De reacties zijn altijd verschillend, van meezingen, meeklappen, stil luisteren tot aan huilen van ontroering. Dit maakt dit evenement voor ons altijd heel bijzonder!

- title: Concertgebouw Amsterdam
  date: 16 mei 2016
  image: content/images/20160516_concertgebouw_amsterdam.webp
  content: |
    Wow! Dit hadden we nog nooit gedaan. Zingen in het Concertgebouw! Wat een belevenis. Overal door het hele gebouw waren optredens... duizenden mensen! Het was een belevenis. Wel wat rumoerig door het grote aantal mensen en plaatsen waar muziek gemaakt werd.

    Maar we hebben het toch maar weer gedaan! Helaas mochten we niet in de grote zaal optreden want deze was uiteraard voor de grote groepen. Toch wel even op het beroemde podium gestaan voor de foto!

- title: Verpleeghuis Texel
  date: 13 mei 2016
  image: content/images/20160513_verpleeghuis_texel.webp
  content: |
    Voor de 2e keer werden we uitgenodigd om in het Verpleeghuis op te treden voor de bewoners. Altijd weer een bijzondere belevenis om mensen te zien opbloeien als je voor ze zingt.

    Mensen met bijna geen uitdrukking leven op, gaan meewiegen of meezingen. Kortom, altijd weer fijn om te merken wat muziek kan doen.

- title: Paradiso Korendag
  date: 16 januari 2016
  image: content/images/20160116_paradiso_korendag.webp
  content: |
    Al voor de 5e keer mochten we op het podium staan van Paradiso! Altijd een feest om te doen. Het publiek en de sfeer zijn daar fantastisch. Dit keer was dat ook weer zo, echter de weg ernaartoe had wel wat hobbels...

    Eerst natuurlijk 's ochtends met de boot vanaf Texel naar Castricum, daar nog een keer de voorbereide show doorspelen en de laatste puntjes op de i zetten. Verkleden, inpakken en op naar Amsterdam! Als je dan in een file komt begint de tijd te dringen... zeker als je daarna in de stad nogmaals in een file komt... Dan snel de auto in de garage, spullen mee, rennend naar Paradiso, je melden bij de balie en dan... heb je nog 2 minuten voordat je op moet! Nog heeeel snel een plas, jas uit, hakken aan en GAAN! Maar ook nu was het weer een feest!

- title: Skarrelen op Texel
  date: 27 november 2015
  image: content/images/20151127_skarrelen_op_texel.webp
  content: |
    Een nieuw festival op Texel: 'Skarrelen'. In het dorp Oosterend waren er gedurende een heel weekend op verschillende plekken optredens van diverse koren, bands e.d. Wij mochten optreden in de kerk. Op zich een prachtige plek met een geweldige akoestiek. Door de strenge kou die er dat weekend was en de niet echt gelukkige planning van het programma waren er minder mensen in de kerk dan verwacht en bleven er velen in de cafés en verwarmde tenten. Evengoed was het publiek dat er was erg enthousiast! Gelukkig hebben we al een vaste kern van fans die dan ook ruimschoots aanwezig was!

- title: Balk Top Festival
  date: 31 oktober 2015
  image: content/images/20151031_balk_top_festival.webp
  content: |
    Het Balk Top Festival is een tweejaarlijks festival voor de beste koren van Nederland. Wij waren ingedeeld bij de kleine groepen in de Topklasse (wedstrijd). Twee jaar geleden hebben we deze wedstrijd gewonnen en waren we daar nu om onze plek te verdedigen.... maar net als in de topsport... 1e worden is al moeilijk... maar om de 2e keer weer 1e te worden is nog moeilijker! En zo geschiedde. Niet gewonnen, maar wel heel veel plezier gehad en nogmaals onze 'nieuwe' show op de planken mogen zetten! Prachtig jurycommentaar gekregen met veel bruikbare tips waar we verder mee aan de slag gaan. Weer veel mooie andere koren gezien en gehoord! Het blijft altijd een heel inspirerende dag waar we veel ideeën en contacten opdoen! Tot in 2017!
    Door alle drukte vergeten een foto te maken........ maar deze dames vertegenwoordigen ons ook goed......

- title: Connection koor bestaat 30 jaar!
  date: 26 september 2015
  image: content/images/20150926_connection_koor_bestaat_30_jaar.webp
  content: |
    We werden gevraagd om een verrassingsconcert te geven voor het koor Connexion uit Castricum, dat zijn 30-jarig jubileum vierde! We hadden speciaal voor deze gelegenheid een show gemaakt met als thema waar alle koren 'last' van hebben, namelijk het tekort aan 'MANNEN'. Een heel herkenbaar punt, zeker gezien de reacties! Heerlijk om op deze manier aan andere zangers te laten horen wat de mogelijkheden zijn met 3 stemmen. Na afloop kregen we nog als cadeau een paar prachtige nummers te horen gezongen door Connexion. Kortom, het was een feest!

- title: De Luwte 5 jaar!
  date: 13 september 2015
  image: content/images/20150913_de_luwte_5_jaar.webp
  content: |
    5 jaar geleden hebben we mogen optreden bij de opening van dit restaurant 'De Luwte'! Ook bij dit jubileum werden we gevraagd om nogmaals onze zangkunsten te vertonen! Wat was het weer heerlijk om te doen en om een show speciaal te maken voor Evert en Marietta om dit heugelijke feit te vieren! Zeker ook gezien het feit dat we daarna samen met alle genodigden mochten genieten van een heerlijk diner! Wie weet tot over 5 jaar!

- title: Texel Culinair
  date: 11 september 2015
  image: content/images/20150911_texel_culinair.webp
  content: |
    Elk jaar staat het 2e weekend van september in het teken van Texel Culinair. In De Koog presenteren de Texelse restaurants zich dan gedurende 3 dagen. Een groot festijn met duizenden bezoekers, zowel van Texel als van 'de overkant'. Wij mochten dit jaar 2 avonden het festijn opluisteren met onze zang.

    We hebben deze keer een ander concept gekozen en zijn de straat op gegaan met een mengkom vol briefjes. Op elk briefje stond een gedicht van 2 regels als introductie op het nummer dat op het briefje stond. We spraken iemand aan en hij/zij mocht dan een liedje 'trekken' dat wij vervolgens gingen zingen. Door die manier kwamen er steeds meer mensen om ons heen staan en werd het een gezellige boel. Na elk lied liepen we weer door en spraken we iemand anders aan! Het was voor het eerst dat we op deze manier onze nummers ten gehore brachten, maar het was echt gaaf om het zo te doen. Aan de reacties te zien vond het publiek, van jong tot oud, dit ook een geslaagd concept!

- title: Koorbiennale Hofjesconcerten Haarlem
  date: 28 juni 2015
  image: content/images/20150628_koorbiennale_hofjesconcerten_haarlem.webp
  content: |
    Dit jaar mochten we optreden tijdens de Hofjesconcerten in Haarlem. Wij stonden in een 400 jaar oud hofje, tussen de regenbuien door. De ambiance was prachtig en de sfeer was bijzonder. Dit werd nog mede versterkt doordat we opgenomen werden voor het tv-programma Podium On Tour op NPO2 (vanaf 5.00 zijn we te zien).

- title: Verpleeghuis en Hotel de Waal
  date: 12 juni 2015
  image: content/images/20150612_verpleeghuis_en_hotel_de_waal.webp
  content: |
    Wat bijzonder om op dezelfde dag 2 verschillende optredens te mogen verzorgen. Eerst in het verpleeghuis voor de bewoners die wilden en konden luisteren. De een op een stoel, de ander in een rolstoel of in een bed! We hadden gekozen om wat bekende 'oude' nummers te zingen die wellicht een herinnering op zouden roepen van vroeger. De reacties waren overweldigend. Mensen die eerst helemaal in zichzelf leken, gaven reacties als meebewegen, meezingen, lachen e.d. Wat blijft het toch bijzonder om te ervaren wat muziek met mensen kan doen! Zeker voor herhaling vatbaar!

    Daarna op naar De Waal, waar we een buitenoptreden op het terras hebben gegeven voor de aanwezige terras- en hotelgasten. Leuk om te zien was dat ook veel fietsers stopten en bleven staan luisteren! Het blijft altijd wel wat lastig om buiten te zingen i.v.m. de akoestiek en zeker op Texel met vaak (te)veel wind! Maar de weergoden waren ons goed gezind! Prachtige zon, bijna geen wind en blije gasten!

- title: Amusing Hengelo
  date: 6 juni 2015
  image: content/images/20150606_amusing_hengelo.webp
  content: |
    Dit jaar weer meegedaan met Amusing Hengelo! En dat heeft wel wat voeten in de aarde. Het is niet te doen om op dezelfde dag heen en weer naar Hengelo/Texel te rijden. Dus maar een nachtje bijgeboekt. Het was weer prachtig weer wat voor het buitenoptreden heerlijk was! Daarna een optreden voor een jury! Altijd weer spannend, zeker met deze show die nog heel nieuw is. Mooie complimenten gekregen en ook punten voor verbetering! Kortom inspirerend!!

- title: Cuisine Culinaire
  date: 30 mei 2015
  image: content/images/20150530_cuisine_culinaire.webp
  content: |
    Cuisine Culinair Amsterdam is een kookvereniging met bijna 400 leden die tot doel heeft het in brede zin beoefenen van de culinaire kunst! Een keer per jaar wordt er iets extra's georganiseerd buiten het koken om en dit jaar viel ons de eer! Een betere gelegenheid om nog een keer onze 'kookshow' te spelen was er niet en was dan ook geweldig toepasbaar op deze gelegenheid. Tussendoor hebben wij ook mogen meegenieten van de culinaire kunsten van de 'mannen'. Kortom super genoten, zowel van het optreden als van de verwennerijen!

- title: Zeventig jaar bevrijding op Texel
  date: 21 mei 2015
  image: content/images/20150521_zeventig_jaar_bevrijding_op_texel.webp
  content: |
    We mochten optreden op het feest van 70 jaar bevrijding op Texel. Dit is op Texel niet op 5 maar op 20 mei. Na een prachtige dag met optochten, legervoertuigen, diverse muzikale optredens waren wij het 'slotstuk'. Vanwege de kou buiten werd er besloten dat we binnen in het restaurant mochten optreden.

    Het was even wennen in een geheel nieuwe ruimte en met microfoons! Maar we weten het nu zeker: we gaan sparen voor headsets! Weer een nieuwe uitdaging om ook in grotere ruimtes en bij buitenoptredens te kunnen optreden. Mooie nieuwe ontwikkelingen!

- title: Struun Texel
  date: 22 november 2014
  image: content/images/20141122_struun_texel.webp
  content: |
    Voor het tweede jaar werd het festival 'Struun' georganiseerd op Texel. In twee dorpen waren diverse optreedlocaties gemaakt (tenten, cafés, kerken, bioscoop) waar in totaal 200 optredens (700 artiesten) waren gedurende het weekend van 21 tot en met 23 november. Ook wij hebben dit jaar meegedaan en hebben enorm genoten! Ons eerste optreden was in de bioscoop. De prachtig vernieuwde zaal zat vol en jammer genoeg hebben we mensen teleur moeten stellen doordat er geen mensen meer in mochten. Ditzelfde gebeurde de volgende dag in het restaurant waar wij optraden. Kortom, het was weer een feest om mensen blij te zien worden als we voor ze zingen!

- title: Guus en Loes 60 jaar!
  date: 20 september 2014
  image: content/images/20140920_guus_en_loes_60_jaar.webp
  content: |
    We waren uitgenodigd om het feest van Guus en Loes te komen opluisteren! 5 jaar geleden hebben we ook voor Guus en Loes opgetreden vanwege een heel andere feestelijke gelegenheid. Deze keer waren er meerdere aanleidingen voor het vieren van een mooi feest: Loes 60 jaar, Guus gepensioneerd, 25 jaar bij elkaar en het uitbrengen van een nieuw boek door Guus! Het feest was in Amsterdam in een mooie gerestaureerde molen. Een prachtige locatie. We hadden speciaal voor Guus en Loes een programma gemaakt waarin we de hoogtepunten extra hebben belicht door middel van tekst en zang! Het was weer een hele eer om op deze manier zowel Guus en Loes als alle andere gasten te mogen verblijden!

- title: Broadway Den Hoorn
  date: 6 juni 2014
  image: content/images/20140606_broadway_den_hoorn.webp
  content: |
    Voor de 7e keer mochten we dit jaar meedoen aan het huiskamerfestival Broadway Den Hoorn. We hadden ook dit jaar weer een geheel nieuwe show gemaakt met nieuwe nummers van nieuwe arrangeurs, een nieuwe muzikale coach en een nieuwe regisseuse! Kortom, veel nieuws! De show had voor het eerst een serieus thema, iets wat niet door iedereen begrepen werd. Er is veel geleerd en er zal nog een vervolg hierop komen! Het blijft altijd een feest om aan dit festival mee te mogen doen. Een fantastische organisatie, sfeer en publiek! Tot in 2016!

- title: Bitter en Zoet - Veenhuizen
  date: 16 februari 2014
  image: content/images/20140216_bitter_en_zoet_veenhuizen.webp
  content: |
    We hebben samen met 3 andere kleine a capella groepen (Accent, Breeze, VPD Kek) een workshop gevolgd onder leiding van vocal coach Merel Martens. Een super leerzame en inspirerende dag met geweldige tips en trucs!! 's Avonds mocht iedere groep tijdens het diner een optreden geven van 20 minuten. Heerlijk om te doen en het publiek tijdens de gangen te zien genieten. De avond eindigde met z'n allen samen zingend You've Got a Friend!! Het was een feest en zeker voor herhaling vatbaar!

- title: Paradiso Korendagen
  date: 19 januari 2014
  image: content/images/20140119_paradiso_korendagen.webp
  content: |
    Ook dit jaar hebben we weer mogen meedoen aan de Paradiso Korendagen! 20 minuten optreden in een vol Paradiso met een geweldige sfeer!
    Enthousiast publiek dat of zelf net opgetreden heeft of nog op de bühne moet. Kortom, iedereen die meedoet heeft iets met zingen en muziek maken. Reagerend op de complimenten is het voor veel mensen bijzonder om te zien dat wij daar staan met z'n drieën en dan a capella zingen. Wij hebben zelf genoten, maar gelukkig het publiek ook!

- title: Balk Topfestival in de Doelen
  date: 9 november 2013
  image: content/images/20131109_balk_topfestival_in_de_doelen.webp
  content: |
    We hebben meegedaan aan het tweejaarlijkse Balk Topfestival. Dit is een festival waar in principe alle Nederlandse koren zich voor kunnen opgeven. Er is een competitie aan verbonden in verschillende categorieën. Wij waren ingedeeld in de hoogste 'klasse' (Top) in de kleine vocale groepen. Het was een drukte van belang in alle zalen en er waren zeker zo'n 2000 mensen die die dag aan het optreden of luisteren waren. Het publiek was uitermate enthousiast en reageerde geweldig! Ook de jury was blijkbaar onder de indruk, want wat bleek..... We hadden de competitie gewonnen!! Als prijs mochten we 's avonds optreden op het grote podium van De Doelen! Het was spannend maar geweldig om te doen! Optreden op zo'n groot podium voor 2000 mensen....... heel bijzonder!

- title: Amusing Hengelo
  date: 8 juni 2013
  image: content/images/20130608_amusing_hengelo.webp
  content: |
    We zijn afgelopen weekend afgereisd naar Hengelo voor het jaarlijkse zangfestijn Amusing Hengelo. Tijdens dit festival treden er door de hele stad gedurende de hele dag 100 koren op! Het was een hele reis vanaf Texel, maar het was een FEEST!! Het publiek was fantastisch!

    We hebben 2 optredens gegeven in een zonovergoten Hengelo. Eerst 1 in een winkelstraat. Spannend voor ons... want ja, loopt niet iedereen winkelend door?... maar nee, dit gebeurde gelukkig niet. We hadden veel, meer dan 100 mensen, aandachtig luisterend, lachend en genietend publiek.

    Daarna traden we op in de kerk waar we meededen aan het NFVE (Nederlands Festival Vocale Ensembles). Een optreden dat beoordeeld werd door een strenge jury. Een prachtige kerk met een hele mooie klank, maar jammer genoeg niet veel publiek. Door het mooie weer was het buiten fijner om te luisteren naar alle zangers en zangeressen. Ondanks dit hebben wij de 2e prijs in de wacht weten te slepen met als beloning een cheque van € 150,- voor het volgen van workshops. Kortom, een geslaagd weekend voor ons waarna we weer op weg konden om de laatste boot naar Texel te halen.

- title: Bonte Brons Avond in Klif 12
  date: 21 januari 2013
  image: content/images/20130121_bonte_brons_avond_in_klif_12.webp
  content: |
    Een bijzonder optreden voor ons. Samen met de familie van Anneke gaan we optreden. Eerst zijn wij als Anyway (Anneke Brons) en brengen onze show Broadway 2012 op de planken. Daarna treedt Lauri Brons op met een pianist en brengt prachtige, zowel klassieke als musicalnummers ten gehore. De avond wordt afgesloten met de band Wadever van Martes Brons.

