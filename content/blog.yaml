      alt: "Acapabel jubileumconcert"
      width: 1125
      height: 886
  content: |
    Ons tweede optreden was er een op uitnodiging. Het grote a capella mannenkoor Acapabel bestond 10 jaar en tijdens dit jubileumconcert waren wij gevraagd om op te treden. Dit was een grote eer voor ons en voor het eerst zonder standaards en geregisseerd door Aris van Zeijlen.

    Zowel voor ons als het publiek was het een spannend optreden. Wij hadden nog nooit voor zoveel mensen op deze manier opgetreden en het publiek had op deze manier nog nooit met ons kennisgemaakt wat de meest uiteenlopende reacties opriep. Dit was voor ons nogmaals de bevestiging dat we verder wilde gaan met het a capella zingen en dat het goed bij ons paste.

