# legacy-review-source-id: 2004-07-03-pleintheater-amsterdam
- title: "Balkfestival - Pleintheater - Amsterdam"
  date: "3 juli 2004"
  link: ""
  images:
    - src: "content/images/20040703_balkfestival_pleintheater_amsterdam.webp"
      alt: "040703p110_1074kkkkkkanywaypleinthadam"
      width: 1149
      height: 1021
    - src: "content/images/20040703_balkfestival_pleintheater_amsterdam_02.webp"
      alt: "040703p110_1076mmmmmanywaypleinthadam"
      width: 1055
      height: 987
  content: |
    Na onze optredens tijdens Broadway Den Hoorn in 2004 hadden we de smaak dermate te pakken dat we voor het eerst een optreden hebben gedaan aan 'de overkant' (zoals wij Texelaars dit noemen). We hadden ons ingeschreven voor een a capella festival georganiseerd door Balk (de vereniging van a capella groepen). Het was in het Pleintheater in Amsterdam. Dit was de eerste keer dat wij onszelf zouden presenteren buiten het eiland.

    Daar kwamen wij op met stoeltjes, rozen en nog meer attributen iets wat de meeste andere groepen op dat moment nog niet deden. Nadat we onze show gedaan hadden was de verbazing bij het publiek en de andere groepen duidelijk te merken. Er volgden opmerkingen in de trant van ' Hoe kan dit dat we dit nog nooit gezien hebben', ' Dat dit van een eiland komt.', 'Heel vernieuwend om op deze manier a capella nummers te zingen', ' Wie heeft jullie hierbij geholpen?'.

    Voor ons werd het steeds duidelijker dat deze manier van optreden goed bij ons paste en dat door de hulp van Lizzie Kean (zij arrangeert alle nummers en maakt een programma met ons) ook veel mensen die ons zien ervan genieten.

