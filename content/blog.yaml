      width: 1600
      height: 1200
  content: |
    Ons eerste optreden, nog wel onder de naam The Bitches, was in het voorjaar van 2001 bij de open dag van het Maartenhuis (een zorginstelling voor gehandicapten).

    Spannend om op deze manier voor het eerst op te treden. De zaal zat vol en was muisstil. Nog onder leiding van Hannie Roos en sommige nummers met pianobegeleiding (zie foto) hebben we een halfuur opgetreden. Na afloop waren de reacties zo positief en enthousiast dat dit naar meer smaakte en ons sterkte in ons gevoel dat a capella zingen voor ons DE manier was en de mogelijkheid was om onze hobby verder uit te breiden.
