# legacy-review-source-id: 2010-01-23-paradiso-korendagen
- title: "Korendagen - Paradiso - Amsterdam"
  date: "23 januari 2010"
  link: ""
  images:
    - src: "content/images/20100123_korendagen_paradiso_amsterdam.webp"
      alt: "IMG_04811"
      width: 480
      height: 271
  content: |
    Voor de 2e maal mochten wij meedoen met dit festival. Net als vorig jaar waren wij te laat met inschrijven. Maar ook dit jaar werden wij weer gebeld of wij toch weer wilden komen aangezien er een groep uitgevallen was.
    Het was vorig jaar een groot feest dus ook nu wilden wij weer graag van de partij zijn.

    Ditmaal hebben we het eerste deel van ons nieuwe 'Broadway 2010' programma ten gehore gebracht. Altijd weer heel spannend om te kijken of de liedjes, de teksten en grapjes overkomen bij het publiek. Naar ons idee is dit gelukt en ook aan de reactie van het publiek te merken was men verrast en enthousiast.

    Dit jaar hebben wij voor het eerst gebruik gemaakt van een extra geluid niet door onszelf gemaakt maar door de iPod. Een spannende heartbeat die ons tijdens het nummer My Heart begeleidde. Een nieuwe maar mooie ervaring, zeker iets om in de toekomst uit te breiden.

# legacy-review-source-id: 2009-11-15-eenakterfestival-klif-12-texel
