# legacy-review-source-id: 2010-08-27-reactie-op-ons-optreden-bij-de-theatervloot
- title: "Reactie op ons optreden bij de Theatervloot - De Egberdina - Oude haven van Hoorn"
  date: "27 augustus 2010"
  link: ""
  images:
    - src: "content/images/20100827_reactie_op_ons_optreden_bij_de_theatervloot_de_egberdina_oude_haven_van_hoorn.webp"
      alt: "Reactie op ons optreden bij de Theatervloot - De Egberdina - Oude haven van Hoorn"
      width: 480
      height: 322
  content: |
    Anyway doet het Everywhere!

     In de oude haven van Hoorn, op het schip van kapitein Wouter van Dusseldorp, sinds 1996 de trotse eigenaar van het zeilschip 'Egberdina' luisterden we naar een concert van de Texelse a capella zanggroep Anyway. Het schip blijkt één van de vijf oudste, nog varende zeilschepen in Nederland te zijn. Een klassiek schip met van binnen een prachtig houten interieur.

    Was het de klankkast van het schip of de techniek? De zangeressen zongen loepzuiver. Kwetsbare momenten over vergankelijkheid en verlies zorgden voor een intieme sfeer. Ondanks dat het schip aan de kade bleef zorgden de warme stemmen van Anyway ervoor dat we even helemaal weg waren. Het lied zo mooi gezongen over het kind wat uit huis gaat maakte ons stil. Met bovenaardse kracht werd er onderdeks een bijzondere sfeer gecreëerd. Tussen de nummers werd er luid geapplaudisseerd, en volgend jaar wil de organisatie van de Theatervloot dat ze terugkomen!

    Anyway bestaat uit Irisabella Bakker, Anneke Brons en Ruthie Vazana.
    Op donderdag 26 augustus gaven ze drie concerten bij de Theatervloot in de haven van Hoorn.

    Annette van Ruitenburg zocht ze op. “Eigenlijk was ik wel een beetje trots, het ademloos luisterende publiek zo te zien genieten”. De Texelse Anyway gaf een professioneel concert. Foto is gemaakt door Annemarie Wolkers- Ven

# legacy-review-source-id: 2010-08-26-theatervloot-in-hoorn
