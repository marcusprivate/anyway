    Het wordt vast weer een prachtig Pinksterweekend tijdens het huiskamerfestival Broadway Den Hoorn! We mogen dan weer 8 voorstellingen geven gedurende 2 avonden in een huiskamer van een inwoner van Den Hoorn. Dus heftig maar wel geweldig om te doen! Er zijn nog kaarten. Te bestellen via

