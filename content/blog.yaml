  content: |
    We hebben de opening verzorgd van een nieuw restaurant op Texel - De Luwte -. Het mooie van dit optreden was dat de eigenaar van het restaurant Evert (van der Have) heet. Een feit is dat de afgelopen 6 jaar wij steeds een show hebben gemaakt rond de persoon 'Evert'. Nu was dit natuurlijk de uitgelezen gelegenheid om al onze 'anecdotes/affaires' met Evert in 1 optreden te verwerken. Erg mooi om te doen en het maakte het ook heel erg persoonlijk, wat duidelijk zijn positief effect had op de restaurant-eigenaar.

    Het blijft een prachtig gegeven dat, doordat je voor elk optreden en elke gelegenheid verschillende aspecten en liedjes combineert, je op deze manier toch weer een nieuw programma maakt waardoor het steeds weer verrassend blijft.

    Na het optreden hebben we een heerlijk diner aangeboden gekregen. Dus voor een ieder die een restaurant zoekt waar op een heerlijke en eerlijke manier gekookt wordt raden wij u aan om naar Evert te gaan in 'De Luwte'- Den Burg - 0222-312939

# legacy-review-source-id: 2010-05-21-broadway-den-hoorn
- title: "Broadway - Den Hoorn - Texel"
  date: "21 mei 2010"
  link: ""
  images:
    - src: "content/images/20100521_broadway_den_hoorn_texel.webp"
      alt: "Broadway - Den Hoorn - Texel"
      width: 600
      height: 450
  content: |
    Het tweejaarlijkse evenement 'Broadway Den Hoorn' is weer voorbij. Al voor de 7e keer werd dit tijdens het pinksterweekend georganiseerd. Er worden dan in 1 straat 30 huiskamers ingericht als theater waarin dan 4 voorstellingen per avond gegeven worden door artiesten uit heel Nederland. Ook wij waren uitgenodigd (al voor de 5e keer!).

    De afgelopen 1.5 jaar zijn we bezig geweest met het maken van een nieuw programma voor dit mooie evenement. Dit heeft geresulteerd in 10 nieuwe nummers, waar zowel mensen om hebben kunnen lachen als geëmotioneerd van raakten. Het is altijd weer heel spannend om te ervaren hoe de nummers die je zingt over komen op het publiek. Want na 1.5 jaar tegen een muur zingen is toch heel fijn om te merken dat wat je zingt en vertelt 'aankomt' in de zaal. Voor ons was het weer een feest om te doen en kijken we tevreden terug op weer een heel mooi pinksterweekend!

